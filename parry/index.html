<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>바람의 검객: 모바일 & PC 완전판</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  body { 
    background: #111; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
    text-align: center; margin: 0; padding: 10px; touch-action: none;
  }
  #game-container { max-width: 800px; margin: 0 auto; }
  canvas { 
    background: #181818; border: 2px solid #555; display: block; width: 100%; height: auto;
    border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); 
  }
  .info-bar { font-size: 13px; color: #aaa; margin: 6px 0; }
  .key { color: #00e5ff; font-weight: bold; }

  /* 📱 모바일 가상 패드 컨트롤러 UI */
  #touch-controls {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 800px; margin: 12px auto 0; padding: 0 10px;
  }
  .d-pad, .action-pad { display: flex; gap: 12px; }
  .btn {
    width: 64px; height: 64px; border-radius: 50%; font-size: 18px; font-weight: bold;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); cursor: pointer; touch-action: none;
  }
  .btn:active { transform: scale(0.92); opacity: 0.8; }
  .btn span { font-size: 10px; margin-top: 2px; }
  .btn-move { background: rgba(255, 255, 255, 0.15); font-size: 22px; }
  .btn-parry { 
    width: 72px; height: 72px; border-color: #00e5ff; background: rgba(0, 229, 255, 0.25); 
    box-shadow: 0 0 14px rgba(0, 229, 255, 0.4);
  }
  .btn-dodge { 
    width: 68px; height: 68px; border-color: #b388ff; background: rgba(179, 136, 255, 0.25); 
    box-shadow: 0 0 12px rgba(179, 136, 255, 0.35);
  }
</style>
</head>
<body>
<div id="game-container">
  <div class="info-bar">PC: <span class="key">A/D</span> 이동 | <span class="key">Space</span> 패링 | <span class="key">Shift</span> 회피</div>
  <canvas id="game" width="800" height="340"></canvas>

  <!-- 📱 모바일 가상 패드 -->
  <div id="touch-controls">
    <div class="d-pad">
      <button class="btn btn-move" id="btn-left">◀</button>
      <button class="btn btn-move" id="btn-right">▶</button>
    </div>
    <div class="action-pad">
      <button class="btn btn-dodge" id="btn-dodge">💨<span>회피</span></button>
      <button class="btn btn-parry" id="btn-parry">⚔️<span>패링</span></button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 🖼️ 이미지 리소스
const imgPlayer = new Image(); imgPlayer.src = 'player.png';
const imgBoss = new Image(); imgBoss.src = 'boss.png';
const imgEnemyMelee = new Image(); imgEnemyMelee.src = 'enemy_melee.png';
const imgEnemyRanged = new Image(); imgEnemyRanged.src = 'enemy_ranged.png';

const keys = {};
let touchLeft = false;
let touchRight = false;

// 1. 키보드 이벤트
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') triggerParry();
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyK') triggerDodge();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

// 2. 모바일 터치 이벤트 연결
function bindTouch(btnId, onDown, onUp) {
  const el = document.getElementById(btnId);
  el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); }, { passive: false });
  el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); }, { passive: false });
  el.addEventListener('mousedown', (e) => { e.preventDefault(); onDown(); });
  el.addEventListener('mouseup', (e) => { e.preventDefault(); onUp(); });
}

bindTouch('btn-left', () => touchLeft = true, () => touchLeft = false);
bindTouch('btn-right', () => touchRight = true, () => touchRight = false);
bindTouch('btn-parry', () => triggerParry(), () => {});
bindTouch('btn-dodge', () => triggerDodge(), () => {});

function triggerParry() {
  if (player.state === 'IDLE') {
    player.state = 'PARRY';
    player.timer = 13;
  }
}

function triggerDodge() {
  if ((player.state === 'IDLE' || player.state === 'COOLDOWN') && player.dodgeCooldown <= 0) {
    player.state = 'DODGE';
    player.timer = 14;
    player.dodgeCooldown = 35;
    let moveDir = 0;
    if (keys['KeyA'] || keys['ArrowLeft'] || touchLeft) moveDir = -1;
    if (keys['KeyD'] || keys['ArrowRight'] || touchRight) moveDir = 1;
    player.vx = (moveDir !== 0 ? moveDir : player.facing) * 10;
    spawnParticles(player.x, player.y, '#80d8ff');
  }
}

let stage = 1;
const MAX_STAGE = 5;
let screenShake = 0;
let hitStop = 0;
let slashEffects = [];
let particles = [];
let feedbackText = "적의 칼날을 튕겨내라능!";

let player = { 
  x: 120, y: 200, vx: 0, speed: 4.8, hp: 3, 
  state: 'IDLE', timer: 0, facing: 1, dodgeCooldown: 0,
  drawW: 80, drawH: 95
};
let enemy = null;
let projectiles = [];
let gameState = 'PLAY';

function spawnParticles(x, y, color) {
  for (let i = 0; i < 16; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      life: 20,
      color: color || '#ffeb3b'
    });
  }
}

function spawnEnemy(curStage) {
  if (curStage === 5) {
    return {
      isBoss: true,
      name: "심연의 검귀",
      hp: 5,
      maxHp: 5,
      x: 700,
      y: 195,
      vx: 0,
      drawW: 100,
      drawH: 115,
      hitboxW: 44,
      state: 'DECIDE',
      timer: 40,
      dir: -1,
      facing: -1,
      flashTimer: 0,
      active: true
    };
  }

  const isRanged = (curStage === 2 || curStage === 4);
  return {
    isBoss: false,
    type: isRanged ? 'RANGED' : 'MELEE',
    x: 680,
    y: 200,
    drawW: 80,
    drawH: 95,
    hitboxW: 36,
    speed: 2.2 + curStage * 0.4,
    rushSpeed: 10 + curStage * 1.2,
    state: isRanged ? 'AIM' : 'APPROACH',
    timer: isRanged ? 45 : 35,
    facing: -1,
    active: true
  };
}

enemy = spawnEnemy(stage);

function update() {
  if (hitStop > 0) { hitStop--; return; }
  if (screenShake > 0) screenShake--;

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);
  slashEffects.forEach(s => s.life--);
  slashEffects = slashEffects.filter(s => s.life > 0);

  if (player.dodgeCooldown > 0) player.dodgeCooldown--;

  if (gameState === 'PLAY') {
    // 1. 플레이어 이동 처리 (키보드 + 터치 통합)
    if (player.state === 'IDLE') {
      if (keys['KeyA'] || keys['ArrowLeft'] || touchLeft) { player.x -= player.speed; player.facing = -1; }
      if (keys['KeyD'] || keys['ArrowRight'] || touchRight) { player.x += player.speed; player.facing = 1; }
      player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
    } else if (player.state === 'PARRY') {
      player.timer--;
      if (player.timer <= 0) { player.state = 'COOLDOWN'; player.timer = 15; }
    } else if (player.state === 'COOLDOWN') {
      player.timer--;
      if (player.timer <= 0) player.state = 'IDLE';
    } else if (player.state === 'DODGE') {
      player.x += player.vx;
      player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
      if (player.timer % 3 === 0) spawnParticles(player.x, player.y, 'rgba(0, 229, 255, 0.4)');
      player.timer--;
      if (player.timer <= 0) player.state = 'IDLE';
    } else if (player.state === 'SLIDE_PASS') {
      player.x += player.vx;
      player.timer--;
      if (player.timer <= 0) player.state = 'IDLE';
    }

    // 2. 투사체 판정
    for (let i = projectiles.length - 1; i >= 0; i--) {
      let p = projectiles[i];
      p.x += p.vx;

      if (!p.reflected && Math.abs(p.x - player.x) < 30) {
        if (player.state === 'DODGE') {
          feedbackText = "💨 휙-! 탄환을 회피했다능!";
        } else if (player.state === 'PARRY') {
          p.reflected = true;
          p.vx = -p.vx * 1.5;
          hitStop = 5;
          screenShake = 12;
          spawnParticles(p.x, p.y, '#00e5ff');
          feedbackText = "⚡ 챙-!! 보스의 저격탄을 카운터 반사했다능!";
        } else {
          player.hp--;
          spawnParticles(player.x, player.y, '#f44336');
          projectiles.splice(i, 1);
          feedbackText = "💀 초고속 탄환에 저격당했다능!";
          if (player.hp <= 0) gameState = 'GAMEOVER';
          continue;
        }
      }

      if (p.reflected && enemy && enemy.active && Math.abs(p.x - enemy.x) < 40) {
        hitStop = 7;
        screenShake = 15;
        spawnParticles(enemy.x, enemy.y, '#ff1744');
        projectiles.splice(i, 1);

        if (enemy.isBoss) {
          enemy.hp--;
          enemy.flashTimer = 18;
          feedbackText = `💥 반사탄 명중! 보스 HP 1 감소! (남은 HP: ${enemy.hp})`;
          if (enemy.hp <= 0) {
            enemy.active = false;
            advanceStage();
          } else {
            enemy.state = 'DECIDE';
            enemy.timer = 35;
          }
        } else {
          enemy.active = false;
          advanceStage();
        }
        continue;
      }

      if (p.x < -60 || p.x > canvas.width + 60) projectiles.splice(i, 1);
    }

    // 3. 적 및 보스 AI
    if (enemy && enemy.active) {
      if (enemy.flashTimer > 0) enemy.flashTimer--;

      if (!enemy.isBoss) {
        const dist = enemy.x - player.x;
        enemy.facing = dist > 0 ? -1 : 1;

        if (enemy.type === 'MELEE') {
          if (enemy.state === 'APPROACH') {
            if (Math.abs(dist) > 150) enemy.x += (dist > 0 ? -enemy.speed : enemy.speed);
            else { enemy.state = 'WINDUP'; enemy.timer = Math.max(16, 36 - stage * 4); }
          } else if (enemy.state === 'WINDUP') {
            enemy.timer--;
            if (enemy.timer <= 0) enemy.state = 'RUSH';
          } else if (enemy.state === 'RUSH') {
            enemy.x += enemy.facing * enemy.rushSpeed;
            if (Math.abs(enemy.x - player.x) < 40) handleClash(enemy, enemy.facing);
          }
        } else if (enemy.type === 'RANGED') {
          enemy.timer--;
          if (enemy.timer <= 0) {
            projectiles.push({ x: enemy.x - 25, y: enemy.y - 12, vx: -(5.5 + stage * 0.7), reflected: false });
            enemy.timer = 60 - stage * 5;
          }
        }
      } else {
        // [👑 최종 보스 AI]
        if (enemy.state === 'DECIDE') {
          enemy.timer--;
          if (enemy.timer <= 0) {
            const patternRoll = Math.random();
            if (enemy.hp <= 4 && patternRoll < 0.45) {
              enemy.state = 'CHARGE_SNIPE';
              enemy.timer = 30;
              enemy.facing = enemy.x > player.x ? -1 : 1;
            } else {
              enemy.state = 'READY_RUSH';
              enemy.timer = 25;
            }
          }
        } else if (enemy.state === 'CHARGE_SNIPE') {
          enemy.timer--;
          if (enemy.timer % 6 === 0) spawnParticles(enemy.x, enemy.y, '#ff4081');

          if (enemy.timer <= 0) {
            const shootDir = enemy.x > player.x ? -1 : 1;
            projectiles.push({
              x: enemy.x + shootDir * 30,
              y: enemy.y - 14,
              vx: shootDir * 12,
              reflected: false
            });
            spawnParticles(enemy.x, enemy.y, '#ff1744');
            enemy.state = 'DECIDE';
            enemy.timer = 45;
          }
        } else if (enemy.state === 'READY_RUSH') {
          enemy.dir = enemy.x > player.x ? -1 : 1;
          enemy.facing = enemy.dir;
          enemy.state = 'WINDUP';
          enemy.timer = 28;
        } else if (enemy.state === 'WINDUP') {
          enemy.timer--;
          if (enemy.timer <= 0) enemy.state = 'RUSH';
        } else if (enemy.state === 'RUSH') {
          enemy.x += enemy.dir * 15;
          if (Math.abs(enemy.x - player.x) < 42) handleClash(enemy, enemy.dir);

          if ((enemy.dir === -1 && enemy.x < 50) || (enemy.dir === 1 && enemy.x > canvas.width - 50)) {
            enemy.state = 'DECIDE';
            enemy.timer = 35;
          }
        } else if (enemy.state === 'SLASHED_PASS') {
          enemy.x += enemy.vx;
          enemy.timer--;
          spawnParticles(enemy.x, enemy.y, '#ff1744');

          if (enemy.timer <= 0) {
            if (enemy.hp <= 0) {
              enemy.active = false;
              advanceStage();
            } else {
              enemy.state = 'DECIDE';
              enemy.timer = 40;
            }
          }
        }
      }
    }
  } else if (gameState === 'ADVANCING') {
    player.x += 7;
    player.facing = 1;
    if (player.x > canvas.width + 40) {
      stage++;
      player.x = -30;
      projectiles = [];
      enemy = spawnEnemy(stage);
      feedbackText = stage === 5 ? "⚠️ BOSS WARNING: 심연의 검귀 등장!" : `🔥 STAGE ${stage} 돌입!`;
    }
    if (player.x >= 120 && player.x < 130) {
      player.x = 120;
      gameState = 'PLAY';
    }
  }
}

function handleClash(target, attackDir) {
  if (player.state === 'DODGE') {
    feedbackText = "💨 휙-! 보스의 참격을 굴러서 회피했다능!";
    return;
  }

  if (player.state === 'PARRY') {
    hitStop = 9;
    screenShake = 22;

    if (target.isBoss) {
      target.hp--;
      target.flashTimer = 20;
      feedbackText = `💥 챙-!! 보스의 몸을 베어 가르며 스쳐 지나갔다능! (남은 HP: ${target.hp})`;

      target.state = 'SLASHED_PASS';
      target.vx = attackDir * 11;
      target.timer = 14;

      player.state = 'SLIDE_PASS';
      player.vx = -attackDir * 9;
      player.timer = 12;

      slashEffects.push({ target: target, life: 18 });
      spawnParticles(target.x, target.y, '#ffffff');
    } else {
      slashEffects.push({ target: target, life: 15 });
      spawnParticles(target.x, target.y, '#ffffff');
      target.active = false;
      feedbackText = `💥 챙-!! 일도양단으로 베어 넘겼다능!`;
      advanceStage();
    }
  } else {
    player.hp--;
    spawnParticles(player.x, player.y, '#f44336');
    feedbackText = "💀 큭! 참격을 쳐내지 못했다능!";
    target.state = target.isBoss ? 'DECIDE' : 'APPROACH';
    target.timer = 35;
    target.x += attackDir * -80;
    if (player.hp <= 0) gameState = 'GAMEOVER';
  }
}

function advanceStage() {
  if (stage >= MAX_STAGE) gameState = 'VICTORY';
  else gameState = 'ADVANCING';
}

function drawCharacter(img, x, y, width, height, facingRight, alpha = 1.0, isFlashing = false) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);

  if (!facingRight) ctx.scale(-1, 1);
  if (isFlashing) ctx.filter = 'brightness(2.5) contrast(1.5)';

  if (img.complete && img.naturalWidth !== 0) {
    ctx.drawImage(img, -width / 2, -height / 2, width, height);
  } else {
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(-width / 4, -height / 2, width / 2, height);
  }
  ctx.restore();
}

function draw() {
  ctx.save();
  if (screenShake > 0) {
    ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 바닥
  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 248, canvas.width, 2);

  // 플레이어
  const isPlayerFacingRight = (player.facing === 1);
  const playerAlpha = (player.state === 'DODGE') ? 0.45 : 1.0;
  drawCharacter(imgPlayer, player.x, player.y, player.drawW, player.drawH, isPlayerFacingRight, playerAlpha);

  // 패링 가드 실드
  if (player.state === 'PARRY') {
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 5;
    ctx.strokeRect(player.x - 24, player.y - 48, 48, 96);
  }

  // 투사체
  projectiles.forEach(p => {
    ctx.fillStyle = p.reflected ? '#00e5ff' : '#ff1744';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.reflected ? 9 : 8, 0, Math.PI * 2);
    ctx.fill();
  });

  // 적 & 보스
  if (enemy && enemy.active) {
    const isEnemyFacingRight = (enemy.facing === 1);

    if (enemy.isBoss) {
      const isBossFlashing = (enemy.flashTimer > 0 || enemy.state === 'SLASHED_PASS');
      drawCharacter(imgBoss, enemy.x, enemy.y, enemy.drawW, enemy.drawH, isEnemyFacingRight, 1.0, isBossFlashing);

      if (enemy.state === 'WINDUP' || enemy.state === 'CHARGE_SNIPE') {
        ctx.fillStyle = '#ff1744';
        ctx.font = 'bold 28px sans-serif';
        ctx.fillText('!', enemy.x - 5, enemy.y - 65);
      }
    } else {
      const targetImg = (enemy.type === 'RANGED') ? imgEnemyRanged : imgEnemyMelee;
      drawCharacter(targetImg, enemy.x, enemy.y, enemy.drawW, enemy.drawH, isEnemyFacingRight);

      if (enemy.state === 'WINDUP' || (enemy.type === 'RANGED' && enemy.timer < 16)) {
        ctx.fillStyle = '#ff1744';
        ctx.font = 'bold 24px sans-serif';
        ctx.fillText('!', enemy.x - 4, enemy.y - 55);
      }
    }
  }

  // 참격선 연출
  slashEffects.forEach(s => {
    const targetX = s.target ? s.target.x : player.x;
    const targetY = s.target ? s.target.y : player.y;

    ctx.strokeStyle = '#ff1744';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(targetX - 65, targetY - 70);
    ctx.lineTo(targetX + 65, targetY + 70);
    ctx.stroke();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(targetX - 70, targetY - 60);
    ctx.lineTo(targetX + 70, targetY + 60);
    ctx.stroke();
  });

  // 파티클
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3.5, 3.5);
  });

  // UI
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`STAGE: ${stage} / ${MAX_STAGE}`, 25, 30);
  ctx.fillText(`체력: ${'❤️'.repeat(Math.max(0, player.hp))}`, 25, 52);

  const dodgeReady = player.dodgeCooldown <= 0;
  ctx.fillStyle = dodgeReady ? '#00e5ff' : '#777';
  ctx.fillText(`회피: ${dodgeReady ? 'READY' : 'COOL'}`, 25, 74);

  // 보스 HP 바
  if (enemy && enemy.isBoss && enemy.active) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5252';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`${enemy.name} [HP: ${enemy.hp} / 5]`, canvas.width / 2, 28);

    const barWidth = 260;
    const barHeight = 12;
    const startX = canvas.width / 2 - barWidth / 2;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(startX, 36, barWidth, barHeight);

    ctx.fillStyle = '#ff1744';
    ctx.fillRect(startX + 2, 38, (barWidth - 4) * (enemy.hp / enemy.maxHp), barHeight - 4);
  }

  ctx.textAlign = 'center';
  ctx.font = '15px sans-serif';
  ctx.fillStyle = '#eee';
  ctx.fillText(feedbackText, canvas.width / 2, 305);

  // 결과 창
  if (gameState === 'VICTORY') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText('🏆 심연의 검귀 토벌 완료! 🏆', canvas.width / 2, 145);
    ctx.font = '17px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('화면을 새로고침하여 다시 도전해 보라능!', canvas.width / 2, 190);
  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f44336';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText('💀 DEFEAT...', canvas.width / 2, 145);
    ctx.font = '17px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText('화면을 새로고침하여 다시 검을 쥐라능!', canvas.width / 2, 190);
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
