<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>바람의 검객: 일섬 패링</title>
<style>
  body { 
    background: #111; color: #fff; font-family: sans-serif; text-align: center; 
    margin: 0; padding: 15px; user-select: none; -webkit-user-select: none;
  }
  #wrapper { max-width: 800px; margin: 0 auto; }
  canvas { 
    background: #181818; border: 2px solid #555; display: block; width: 100%; height: auto;
    border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.8); 
  }
  p { font-size: 13px; color: #aaa; margin: 8px 0; }
  .key { color: #00e5ff; font-weight: bold; }

  #mobile-pad {
    display: flex; justify-content: space-between; align-items: center;
    max-width: 800px; margin: 15px auto 0; padding: 0 10px;
  }
  .pad-group { display: flex; gap: 12px; }
  .t-btn {
    width: 65px; height: 65px; border-radius: 50%; font-size: 20px; font-weight: bold;
    color: #fff; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
    cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .t-btn span { font-size: 10px; margin-top: 2px; }
  .t-btn:active { transform: scale(0.92); opacity: 0.8; }
  .btn-parry { border-color: #00e5ff; background: rgba(0, 229, 255, 0.25); color: #00e5ff; width: 72px; height: 72px; }
  .btn-dodge { border-color: #b388ff; background: rgba(179, 136, 255, 0.25); color: #b388ff; }
</style>
</head>
<body>
<div id="wrapper">
  <p>PC: <span class="key">A / D</span> 이동 | <span class="key">Space</span> 패링 | <span class="key">Shift / K</span> 회피</p>
  <canvas id="game" width="800" height="340"></canvas>

  <div id="mobile-pad">
    <div class="pad-group">
      <button class="t-btn" id="m-left">◀</button>
      <button class="t-btn" id="m-right">▶</button>
    </div>
    <div class="pad-group">
      <button class="t-btn btn-dodge" id="m-dodge">💨<span>회피</span></button>
      <button class="t-btn btn-parry" id="m-parry">⚔️<span>패링</span></button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const imgPlayerIdle = new Image(); imgPlayerIdle.src = 'player_idle.png';
const imgPlayerRun = new Image(); imgPlayerRun.src = 'player_run.png';
const imgPlayerAttack = new Image(); imgPlayerAttack.src = 'player_attack.png';
const imgBoss = new Image(); imgBoss.src = 'boss.png';
const imgEnemyMelee = new Image(); imgEnemyMelee.src = 'enemy_melee.png';
const imgEnemyRanged = new Image(); imgEnemyRanged.src = 'enemy_ranged.png';

const keys = {};

window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'Space') onParry();
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyK') onDodge();
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function attachTouch(id, onStart, onEnd) {
  const btn = document.getElementById(id);
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); onStart(); }, { passive: false });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); onEnd(); }, { passive: false });
  btn.addEventListener('mousedown', (e) => { e.preventDefault(); onStart(); });
  btn.addEventListener('mouseup', (e) => { e.preventDefault(); onEnd(); });
}

attachTouch('m-left', () => { keys['KeyA'] = true; }, () => { keys['KeyA'] = false; });
attachTouch('m-right', () => { keys['KeyD'] = true; }, () => { keys['KeyD'] = false; });
attachTouch('m-parry', () => { onParry(); }, () => {});
attachTouch('m-dodge', () => { onDodge(); }, () => {});

function onParry() {
  if (player.state === 'IDLE' || player.state === 'RUN') {
    player.state = 'PARRY';
    player.timer = 14;
  }
}

function onDodge() {
  if ((player.state === 'IDLE' || player.state === 'RUN' || player.state === 'COOLDOWN') && player.dodgeCooldown <= 0) {
    player.state = 'DODGE';
    player.timer = 14;
    player.dodgeCooldown = 35;
    let moveDir = 0;
    if (keys['KeyA'] || keys['ArrowLeft']) moveDir = -1;
    if (keys['KeyD'] || keys['ArrowRight']) moveDir = 1;
    player.vx = (moveDir !== 0 ? moveDir : player.facing) * 10;
    spawnParticles(player.x, player.y, '#80d8ff');
  }
}

let stage = 1;
const MAX_STAGE = 5;
let screenShake = 0;
let hitStop = 0;
let slashEffects = [];
let particles = [];
let feedbackText = "적의 칼날을 튕겨내라능!";
let projectiles = [];
let gameState = 'PLAY';

let player = { 
  x: 120, y: 200, vx: 0, speed: 4.8, hp: 3, 
  state: 'IDLE', timer: 0, facing: 1, dodgeCooldown: 0,
  w: 80, h: 96
};
let enemy = null;

function spawnParticles(x, y, color) {
  for (let i = 0; i < 16; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      life: 20,
      color: color || '#ffeb3b'
    });
  }
}

function spawnEnemy(curStage) {
  if (curStage === 5) {
    return {
      isBoss: true,
      name: "심연의 검귀",
      hp: 5,
      maxHp: 5,
      x: 680,
      y: 195,
      vx: 0,
      w: 100,
      h: 116,
      state: 'DECIDE',
      timer: 30,
      dir: -1,
      facing: -1,
      flashTimer: 0,
      active: true
    };
  }

  const isRanged = (curStage === 2 || curStage === 4);
  return {
    isBoss: false,
    type: isRanged ? 'RANGED' : 'MELEE',
    x: 680,
    y: 200,
    w: 80,
    h: 96,
    speed: 3.2 + curStage * 0.3,
    rushSpeed: 11 + curStage * 1.0,
    state: isRanged ? 'AIM' : 'APPROACH',
    timer: isRanged ? 45 : 0,
    facing: -1,
    active: true
  };
}

enemy = spawnEnemy(stage);

function handleClash(target, attackDir) {
  if (player.state === 'DODGE') {
    feedbackText = "💨 휙-! 참격을 굴러서 회피했다능!";
    return;
  }

  if (player.state === 'PARRY') {
    hitStop = 9;
    screenShake = 22;

    if (target.isBoss) {
      target.hp--;
      target.flashTimer = 20;
      feedbackText = `💥 챙-!! 보스의 몸을 베어 넘겼다능! (남은 HP: ${target.hp})`;

      target.state = 'SLASHED_PASS';
      target.vx = attackDir * 11;
      target.timer = 14;

      player.state = 'SLIDE_PASS';
      player.vx = -attackDir * 9;
      player.timer = 12;

      slashEffects.push({ x: target.x, y: target.y, life: 18 });
      spawnParticles(target.x, target.y, '#ffffff');

      if (target.hp <= 0) {
        target.active = false;
        advanceStage();
      }
    } else {
      slashEffects.push({ x: target.x, y: target.y, life: 16 });
      spawnParticles(target.x, target.y, '#ffffff');
      target.active = false;
      feedbackText = `💥 챙-!! 일도양단으로 베어 넘겼다능!`;
      advanceStage();
    }
  } else {
    player.hp--;
    spawnParticles(player.x, player.y, '#f44336');
    feedbackText = "💀 큭! 참격을 쳐내지 못했다능!";

    if (target.isBoss) {
      target.state = 'DECIDE';
      target.timer = 35;
      target.x += attackDir * -40;
    } else {
      target.state = 'APPROACH';
      target.timer = 20;
      target.x += attackDir * -90;
    }

    if (player.hp <= 0) gameState = 'GAMEOVER';
  }
}

function advanceStage() {
  if (stage >= MAX_STAGE) gameState = 'VICTORY';
  else {
    gameState = 'ADVANCING';
    feedbackText = `🔥 STAGE ${stage + 1} 돌입! 전진하라능!`;
  }
}

function update() {
  if (hitStop > 0) { hitStop--; return; }
  if (screenShake > 0) screenShake--;

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);
  slashEffects.forEach(s => s.life--);
  slashEffects = slashEffects.filter(s => s.life > 0);

  if (player.dodgeCooldown > 0) player.dodgeCooldown--;

  if (gameState === 'PLAY') {
    // 1. 플레이어 제어
    if (player.state === 'IDLE' || player.state === 'RUN') {
      let move = 0;
      if (keys['KeyA'] || keys['ArrowLeft']) move = -1;
      if (keys['KeyD'] || keys['ArrowRight']) move = 1;

      if (move !== 0) {
        player.x += move * player.speed;
        player.facing = move;
        player.state = 'RUN';
      } else {
        player.state = 'IDLE';
      }
      player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
    } else if (player.state === 'PARRY') {
      if (--player.timer <= 0) player.state = 'IDLE';
    } else if (player.state === 'DODGE' || player.state === 'SLIDE_PASS') {
      player.x += player.vx;
      player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
      if (player.state === 'DODGE' && player.timer % 3 === 0) spawnParticles(player.x, player.y, 'rgba(0, 229, 255, 0.4)');
      if (--player.timer <= 0) player.state = 'IDLE';
    }

    // 2. 투사체
    for (let i = projectiles.length - 1; i >= 0; i--) {
      let p = projectiles[i];
      p.x += p.vx;

      if (!p.reflected && Math.abs(p.x - player.x) < 32) {
        if (player.state === 'DODGE') {
          feedbackText = "💨 휙-! 탄환을 회피했다능!";
        } else if (player.state === 'PARRY') {
          p.reflected = true;
          p.vx = -p.vx * 1.5;
          hitStop = 6;
          screenShake = 14;
          spawnParticles(p.x, p.y, '#00e5ff');
          feedbackText = "⚡ 챙-!! 탄환을 카운터 반사했다능!";
        } else {
          player.hp--;
          spawnParticles(player.x, player.y, '#f44336');
          projectiles.splice(i, 1);
          feedbackText = "💀 탄환에 피격당했다능!";
          if (player.hp <= 0) gameState = 'GAMEOVER';
          continue;
        }
      }

      if (p.reflected && enemy && enemy.active && Math.abs(p.x - enemy.x) < 42) {
        hitStop = 8;
        screenShake = 18;
        spawnParticles(enemy.x, enemy.y, '#ff1744');
        projectiles.splice(i, 1);

        if (enemy.isBoss) {
          enemy.hp--;
          enemy.flashTimer = 18;
          feedbackText = `💥 반사탄 명중! (남은 HP: ${enemy.hp})`;
          if (enemy.hp <= 0) {
            enemy.active = false;
            advanceStage();
          } else {
            enemy.state = 'DECIDE';
            enemy.timer = 30;
          }
        } else {
          enemy.active = false;
          advanceStage();
        }
        continue;
      }

      if (p.x < -60 || p.x > canvas.width + 60) projectiles.splice(i, 1);
    }

    // 3. 적 & 보스 AI
    if (enemy && enemy.active) {
      if (enemy.flashTimer > 0) enemy.flashTimer--;

      if (!enemy.isBoss) {
        const dist = enemy.x - player.x;
        enemy.facing = dist > 0 ? -1 : 1;

        if (enemy.type === 'MELEE') {
          if (enemy.state === 'APPROACH') {
            enemy.x += (dist > 0 ? -enemy.speed : enemy.speed);
            if (Math.abs(dist) <= 170) {
              enemy.state = 'WINDUP';
              enemy.timer = Math.max(14, 30 - stage * 3);
            }
          } else if (enemy.state === 'WINDUP') {
            if (--enemy.timer <= 0) enemy.state = 'RUSH';
          } else if (enemy.state === 'RUSH') {
            enemy.x += enemy.facing * enemy.rushSpeed;
            if (Math.abs(enemy.x - player.x) < 45) {
              handleClash(enemy, enemy.facing);
            }
            if (enemy.x < 30 || enemy.x > canvas.width - 30) {
              enemy.state = 'APPROACH';
            }
          }
        } else if (enemy.type === 'RANGED') {
          if (Math.abs(dist) < 220) enemy.x += (dist > 0 ? enemy.speed : -enemy.speed);
          if (--enemy.timer <= 0) {
            projectiles.push({
              x: enemy.x + (enemy.facing * 25),
              y: enemy.y - 12,
              vx: enemy.facing * (6.5 + stage * 0.7),
              reflected: false
            });
            enemy.timer = 55 - stage * 5;
          }
        }
      } else {
        const bDist = enemy.x - player.x;

        if (enemy.state === 'DECIDE' || enemy.state === 'CHARGE_SNIPE' || enemy.state === 'WINDUP') {
          enemy.facing = bDist > 0 ? -1 : 1;
        }

        if (enemy.state === 'DECIDE') {
          if (--enemy.timer <= 0) {
            const roll = Math.random();
            if (enemy.hp <= 4 && roll < 0.45) {
              enemy.state = 'CHARGE_SNIPE';
              enemy.timer = 28;
            } else {
              enemy.dir = enemy.facing;
              enemy.state = 'WINDUP';
              enemy.timer = 24;
            }
          }
        } else if (enemy.state === 'CHARGE_SNIPE') {
          if (enemy.timer % 5 === 0) spawnParticles(enemy.x, enemy.y, '#ff4081');
          if (--enemy.timer <= 0) {
            const shootDir = enemy.facing;
            projectiles.push({
              x: enemy.x + shootDir * 30,
              y: enemy.y - 14,
              vx: shootDir * 13,
              reflected: false
            });
            spawnParticles(enemy.x, enemy.y, '#ff1744');
            enemy.state = 'DECIDE';
            enemy.timer = 35;
          }
        } else if (enemy.state === 'WINDUP') {
          if (--enemy.timer <= 0) {
            enemy.state = 'RUSH';
          }
        } else if (enemy.state === 'RUSH') {
          enemy.x += enemy.dir * 15;
          enemy.facing = enemy.dir;
          
          if (Math.abs(enemy.x - player.x) < 45) {
            handleClash(enemy, enemy.dir);
          }
          if ((enemy.dir === -1 && enemy.x < 50) || (enemy.dir === 1 && enemy.x > canvas.width - 50)) {
            enemy.state = 'DECIDE';
            enemy.timer = 25;
          }
        } else if (enemy.state === 'SLASHED_PASS') {
          enemy.x += enemy.vx;
          spawnParticles(enemy.x, enemy.y, '#ff1744');
          if (--enemy.timer <= 0) {
            enemy.state = 'DECIDE';
            enemy.timer = 30;
          }
        }
      }
    }
  } else if (gameState === 'ADVANCING') {
    player.x += 8;
    player.facing = 1;
    player.state = 'RUN';
    if (player.x > canvas.width + 40) {
      stage++;
      player.x = -30;
      projectiles = [];
      enemy = spawnEnemy(stage);
      feedbackText = stage === 5 ? "⚠️ BOSS WARNING: 심연의 검귀 등장!" : `🔥 STAGE ${stage} 돌입!`;
    }
    if (player.x >= 120 && player.x < 130) {
      player.x = 120;
      gameState = 'PLAY';
    }
  }
}

function drawCharacter(imgIdle, imgRun, imgAttack, x, y, width, height, facingRight, state, alpha = 1.0, isFlashing = false) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if (!facingRight) ctx.scale(-1, 1);
  if (isFlashing) ctx.filter = 'brightness(2.5) contrast(1.5)';

  let targetImg = imgIdle;
  if (state === 'RUN') targetImg = imgRun;
  else if (state === 'PARRY') targetImg = imgAttack;

  if (targetImg.complete && targetImg.naturalWidth !== 0) {
    ctx.drawImage(targetImg, -width / 2, -height / 2, width, height);
  } else {
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(-width / 4, -height / 2, width / 2, height);
  }
  ctx.restore();
}

function drawEnemy(img, x, y, width, height, facingRight, alpha = 1.0, isFlashing = false) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  if (!facingRight) ctx.scale(-1, 1);
  if (isFlashing) ctx.filter = 'brightness(2.5) contrast(1.5)';

  if (img.complete && img.naturalWidth !== 0) {
    ctx.drawImage(img, -width / 2, -height / 2, width, height);
  } else {
    ctx.fillStyle = '#f44336';
    ctx.fillRect(-width / 4, -height / 2, width / 2, height);
  }
  ctx.restore();
}

function draw() {
  ctx.save();
  if (screenShake > 0) ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#444';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 248, canvas.width, 1);

  // 플레이어
  const isPlayerFacingRight = (player.facing === 1);
  const playerAlpha = (player.state === 'DODGE' || player.state === 'SLIDE_PASS') ? 0.45 : 1.0;
  drawCharacter(imgPlayerIdle, imgPlayerRun, imgPlayerAttack, player.x, player.y, player.w, player.h, isPlayerFacingRight, player.state, playerAlpha);

  if (player.state === 'PARRY') {
    ctx.strokeStyle = '#00e5ff';
    ctx.lineWidth = 5;
    ctx.strokeRect(player.x - 24, player.y - 48, 48, 96);
  }

  // 탄환
  projectiles.forEach(p => {
    ctx.fillStyle = p.reflected ? '#00e5ff' : '#ff1744';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.reflected ? 9 : 8, 0, Math.PI * 2);
    ctx.fill();
  });

  // 적 & 보스
  if (enemy && enemy.active) {
    const isEnemyFacingRight = (enemy.facing === 1);
    if (enemy.isBoss) {
      // 오른쪽을 보고 있는 원본 이미지에 맞춰 시선을 반전(!isEnemyFacingRight)
      drawEnemy(imgBoss, enemy.x, enemy.y, enemy.w, enemy.h, !isEnemyFacingRight, 1.0, (enemy.flashTimer > 0 || enemy.state === 'SLASHED_PASS'));
      if (enemy.state === 'WINDUP' || enemy.state === 'CHARGE_SNIPE') {
        ctx.fillStyle = '#ff1744';
        ctx.font = 'bold 28px sans-serif';
        ctx.fillText('!', enemy.x - 5, enemy.y - 65);
      }
    } else {
      drawEnemy((enemy.type === 'RANGED' ? imgEnemyRanged : imgEnemyMelee), enemy.x, enemy.y, enemy.w, enemy.h, isEnemyFacingRight);
      if (enemy.state === 'WINDUP') {
        ctx.fillStyle = '#ff1744';
        ctx.font = 'bold 26px sans-serif';
        ctx.fillText('!', enemy.x - 4, enemy.y - 55);
      }
    }
  }

  // 참격선
  slashEffects.forEach(s => {
    ctx.strokeStyle = '#ff1744';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(s.x - 65, s.y - 70);
    ctx.lineTo(s.x + 65, s.y + 70);
    ctx.stroke();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(s.x - 70, s.y - 60);
    ctx.lineTo(s.x + 70, s.y + 60);
    ctx.stroke();
  });

  // 파티클
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 3.5, 3.5);
  });

  // UI
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`STAGE: ${stage} / ${MAX_STAGE}`, 25, 30);
  ctx.fillText(`체력: ${'❤️'.repeat(Math.max(0, player.hp))}`, 25, 52);
  ctx.fillStyle = (player.dodgeCooldown <= 0 ? '#00e5ff' : '#777');
  ctx.fillText(`회피: ${player.dodgeCooldown <= 0 ? 'READY' : 'COOL'}`, 25, 74);

  if (enemy && enemy.isBoss && enemy.active) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5252';
    ctx.font = 'bold 15px sans-serif';
    ctx.fillText(`${enemy.name} [HP: ${enemy.hp} / 5]`, canvas.width / 2, 28);
    const bW = 260;
    const startX = canvas.width / 2 - bW / 2;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.strokeRect(startX, 36, bW, 12);
    ctx.fillStyle = '#ff1744';
    ctx.fillRect(startX + 2, 38, (bW - 4) * (enemy.hp / enemy.maxHp), 8);
  }

  ctx.textAlign = 'center';
  ctx.font = '15px sans-serif';
  ctx.fillStyle = '#eee';
  ctx.fillText(feedbackText, canvas.width / 2, 305);

  if (gameState === 'VICTORY') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText('🏆 심연의 검귀 토벌 완료! 🏆', canvas.width / 2, 145);
  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f44336';
    ctx.font = 'bold 36px sans-serif';
    ctx.fillText('💀 DEFEAT...', canvas.width / 2, 145);
  }

  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
