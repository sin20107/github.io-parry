<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>바람의 검객: 완전판</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body { background: #111; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 10px; touch-action: none; overflow: hidden; }
  #game-container { max-width: 800px; margin: 0 auto; position: relative; }
  canvas { background: #181818; border: 2px solid #555; display: block; width: 100%; height: auto; border-radius: 8px; }
  
  /* 📱 모바일 가상 패드 UI */
  #touch-controls { display: flex; justify-content: space-between; max-width: 800px; margin: 15px auto 0; padding: 0 10px; }
  .d-pad, .action-pad { display: flex; gap: 15px; }
  .btn {
    width: 65px; height: 65px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.1); color: #fff; font-size: 24px; font-weight: bold;
    display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none;
  }
  .btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
  .btn-parry { border-color: #00e5ff; background: rgba(0, 229, 255, 0.2); color: #00e5ff; width: 75px; height: 75px; }
  .btn-dodge { border-color: #b388ff; background: rgba(179, 136, 255, 0.2); color: #b388ff; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="game" width="800" height="340"></canvas>

  <!-- 📱 모바일 가상 패드 -->
  <div id="touch-controls">
    <div class="d-pad">
      <button class="btn" id="btn-left">◀</button>
      <button class="btn" id="btn-right">▶</button>
    </div>
    <div class="action-pad">
      <button class="btn btn-dodge" id="btn-dodge">💨</button>
      <button class="btn btn-parry" id="btn-parry">⚔️</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 🖼️ 이미지 리소스 로드 (주인님의 파일 목록에 맞춤!)
const imgPlayerIdle = new Image(); imgPlayerIdle.src = 'player_idle.png';
const imgPlayerRun = new Image(); imgPlayerRun.src = 'player_run.png';
const imgPlayerAttack = new Image(); imgPlayerAttack.src = 'player_attack.png'; // 패링 모션으로 사용
const imgBoss = new Image(); imgBoss.src = 'boss.png';
const imgEnemyMelee = new Image(); imgEnemyMelee.src = 'enemy_melee.png';
const imgEnemyRanged = new Image(); imgEnemyRanged.src = 'enemy_ranged.png';

let keys = {};
let touchLeft = false;
let touchRight = false;

// 입력 이벤트 설정
window.addEventListener('keydown', e => { 
  keys[e.code] = true; 
  if (e.code === 'Space') triggerParry();
  if (e.code === 'ShiftLeft' || e.code === 'KeyK') triggerDodge();
});
window.addEventListener('keyup', e => keys[e.code] = false);

function bindTouch(id, downFn, upFn) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); downFn(); }, {passive: false});
  el.addEventListener('touchend', e => { e.preventDefault(); upFn(); }, {passive: false});
}
bindTouch('btn-left', () => touchLeft = true, () => touchLeft = false);
bindTouch('btn-right', () => touchRight = true, () => touchRight = false);
bindTouch('btn-parry', triggerParry, () => {});
bindTouch('btn-dodge', triggerDodge, () => {});

// 게임 로직 및 오브젝트 설정 (기존과 동일하되 플레이어 렌더링만 수정)
let player = { x: 120, y: 200, speed: 4.8, hp: 3, state: 'IDLE', timer: 0, facing: 1, dodgeCooldown: 0 };
let enemy = null;
let projectiles = [];
let gameState = 'PLAY';
let stage = 1;
let feedbackText = "적의 칼날을 튕겨내라능!";

function spawnEnemy(s) {
  if (s === 5) return { isBoss: true, hp: 5, maxHp: 5, x: 700, y: 195, state: 'DECIDE', timer: 40, facing: -1, active: true };
  const isR = (s === 2 || s === 4);
  return { isBoss: false, type: isR ? 'R' : 'M', x: 680, y: 200, state: 'APPROACH', timer: 35, facing: -1, active: true };
}
enemy = spawnEnemy(stage);

function triggerParry() { if (player.state === 'IDLE') { player.state = 'PARRY'; player.timer = 15; } }
function triggerDodge() { /* 회피 로직 생략, 기존과 동일 */ }

function update() {
  if (gameState !== 'PLAY') return;
  if (player.dodgeCooldown > 0) player.dodgeCooldown--;

  // 플레이어 이동 및 상태 제어
  if (player.state === 'IDLE' || player.state === 'RUN') {
    let move = 0;
    if (keys['KeyA'] || touchLeft) move = -1;
    if (keys['KeyD'] || touchRight) move = 1;

    if (move !== 0) {
      player.x += move * player.speed;
      player.facing = move;
      player.state = 'RUN'; // 이동 중이면 RUN 상태
    } else {
      player.state = 'IDLE'; // 정지 중이면 IDLE 상태
    }
    player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
  } else if (player.state === 'PARRY') {
    player.timer--;
    if (player.timer <= 0) player.state = 'IDLE';
  }
  // ... 기타 적 AI, 충돌 로직 생략 (기존과 동일)
}

// 🌸 행동별 이미지를 그리는 스마트 렌더링 함수
function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  if (player.facing === -1) ctx.scale(-1, 1); // 왼쪽 볼 때 반전

  let imgToDraw = imgPlayerIdle; // 기본은 대기 이미지
  
  // 상태에 따라 이미지 교체!
  if (player.state === 'RUN') imgToDraw = imgPlayerRun;
  else if (player.state === 'PARRY') imgToDraw = imgPlayerAttack; // 패링 시 공격 이미지
  
  // 회피 중 반투명 처리
  if (player.state === 'DODGE') ctx.globalAlpha = 0.5;

  if (imgToDraw.complete) {
    ctx.drawImage(imgToDraw, -40, -48, 80, 96); // 크기 조정하여 그리기
  } else {
    // 이미지 로딩 실패 시 비상용 초록 네모
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(-20, -40, 40, 80);
  }
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 바닥
  ctx.strokeStyle = '#444'; ctx.strokeRect(0, 248, canvas.width, 1);
  
  drawPlayer(); // 플레이어 그리기

  // ... 적, UI 그리기 생략 (기존과 동일)
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
</body>
</html>
